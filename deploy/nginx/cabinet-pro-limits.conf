# Cabinet Pro: request limit zones, shared by its server blocks.
# Install as /etc/nginx/conf.d/cabinet-pro-limits.conf (Ubuntu includes conf.d/*.conf inside the http block).
# Names start with "cp_" so they never clash with the zones of another site on the same server.

limit_req_zone  $binary_remote_addr zone=cp_api:10m rate=20r/s;     # whole API, per visitor IP
limit_req_zone  $binary_remote_addr zone=cp_auth:10m rate=10r/m;    # sign-in, codes, password reset
limit_req_zone  $binary_remote_addr zone=cp_form:10m rate=3r/m;     # public trial request form
limit_req_zone  $binary_remote_addr zone=cp_static:10m rate=50r/s;  # site files (app, images)
limit_conn_zone $binary_remote_addr zone=cp_conn:10m;               # open connections per visitor IP

