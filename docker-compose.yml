services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: cabinet_pro
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # nginx.conf proxies /api and /uploads to backend:4000
      PORT: 4000
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/cabinet_pro
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY}
      MFA_REQUIRED: ${MFA_REQUIRED:-true}
      SEED_DATABASE: ${SEED_DATABASE:-false}
      APP_TIMEZONE: Africa/Casablanca
      FRONTEND_URL: ${FRONTEND_URL:-}
      # Card payment of subscriptions (CMI). Production gateway: https://payment.cmi.co.ma/fim/est3Dgate
      CMI_CLIENT_ID: ${CMI_CLIENT_ID:-}
      CMI_STORE_KEY: ${CMI_STORE_KEY:-}
      CMI_GATEWAY_URL: ${CMI_GATEWAY_URL:-https://testpayment.cmi.co.ma/fim/est3Dgate}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      # SMS (Infobip) and WhatsApp (Meta Cloud API). Empty = messages are logged, not sent.
      INFOBIP_BASE_URL: ${INFOBIP_BASE_URL:-}
      INFOBIP_API_KEY: ${INFOBIP_API_KEY:-}
      INFOBIP_SMS_SENDER: ${INFOBIP_SMS_SENDER:-CabinetPro}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v20.0}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-fr}
      WHATSAPP_TEMPLATE_APPOINTMENT: ${WHATSAPP_TEMPLATE_APPOINTMENT:-}
      WHATSAPP_TEMPLATE_PLAN_EXPIRY: ${WHATSAPP_TEMPLATE_PLAN_EXPIRY:-}
      WHATSAPP_TEMPLATE_OWNER_MESSAGE: ${WHATSAPP_TEMPLATE_OWNER_MESSAGE:-}
      WHATSAPP_TEMPLATE_PAYMENT: ${WHATSAPP_TEMPLATE_PAYMENT:-}
      WHATSAPP_TEMPLATE_DOCUMENT: ${WHATSAPP_TEMPLATE_DOCUMENT:-}
    volumes:
      - uploads:/app/uploads
      - private-uploads:/app/private-uploads

  # Daily database dump + restore test (deploy/backup.sh). Copy ./backups off the server regularly.
  backup:
    image: mysql:8.4
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: cabinet_pro
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-1}
    entrypoint: ["sh", "/scripts/backup.sh"]
    volumes:
      - ./deploy:/scripts:ro
      - ./backups:/backups

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3100:80"

volumes:
  mysql-data:
  uploads:
  private-uploads:
