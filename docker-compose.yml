services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: cabinet_pro
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # nginx.conf proxies /api and /uploads to backend:4000
      PORT: 4000
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/cabinet_pro
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SEED_DATABASE: ${SEED_DATABASE:-false}
      APP_TIMEZONE: Africa/Casablanca
    volumes:
      - uploads:/app/uploads
      - private-uploads:/app/private-uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3100:80"

volumes:
  mysql-data:
  uploads:
  private-uploads:
