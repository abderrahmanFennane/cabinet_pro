# Request limits per client IP, applied before anything reaches the application (this file is included in the
# http block, so the zones can be declared here). Excess requests get 429 at once and cost almost nothing.
# Behind Cloudflare, add set_real_ip_from <Cloudflare ranges> + real_ip_header CF-Connecting-IP so the real IP is used.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=public_form:10m rate=3r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # At most 40 open connections per IP; slow clients ("slowloris") are cut off instead of holding connections.
    limit_conn perip 40;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 20s;
    keepalive_timeout 30s;
    # Default body size for the API; uploads get more below.
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Built files have a content hash in their name: the browser can keep them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Trial request form of the home page: a few per minute and per IP is plenty for a person.
    location /api/public/ {
        limit_req zone=public_form burst=3 nodelay;
        client_max_body_size 20k;
        proxy_pass http://backend:4000;
        include /etc/nginx/proxy_headers.conf;
    }

    # Sign-in, codes, password reset: brute force is stopped here first.
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        client_max_body_size 20k;
        proxy_pass http://backend:4000;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api {
        limit_req zone=api burst=60 nodelay;
        # Patient files and imports (images, PDF, Excel).
        client_max_body_size 12m;
        proxy_pass http://backend:4000;
        proxy_read_timeout 60s;
        include /etc/nginx/proxy_headers.conf;
    }

    location /uploads {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend:4000;
        include /etc/nginx/proxy_headers.conf;
    }

    location / {
        # index.html must always be fresh so a new release is picked up at once.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
